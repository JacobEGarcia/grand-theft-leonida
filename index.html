// ---------- procedural window texture ----------
function winTexture(base,win,rows,cols,litColor){
  const c=document.createElement('canvas');c.width=128;c.height=256;const g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,128,256);
  const wr=128/cols,hr=256/rows;
  for(let r=0;r<rows;r++)for(let q=0;q<cols;q++){
    g.fillStyle=Math.random()<.55?win:litColor;
    g.fillRect(q*wr+wr*.22,r*hr+hr*.28,wr*.56,hr*.44);
  }
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function neonSign(text,color){
  const c=document.createElement('canvas');c.width=512;c.height=96;const g=c.getContext('2d');
  g.fillStyle='rgba(6,4,16,.85)';g.fillRect(0,0,512,96);
  g.font='bold 54px "Courier New",monospace';g.textAlign='center';g.textBaseline='middle';
  g.shadowColor=color;g.shadowBlur=26;g.fillStyle=color;g.fillText(text,256,50);
  g.shadowBlur=8;g.fillText(text,256,50);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}

  port:{name:'PORT VICE CITY',base:['#5a6068','#6e757e','#4c525a'],h:[7,14],win:'#20242a',lit:'#cfd8e0'},
  strip:{name:'TEQUESTA',base:['#8a90a0','#9aa0b0','#7a8090'],h:[14,34],win:'#2a3040',lit:'#cfe0ff'},
  keys:{name:'VICE KEYS',base:['#f2e6c8','#e8c8d8','#c8e0e0','#f5d8a8'],h:[5,12],win:'#3a3f52',lit:'#ffd9a0'},
  grassrivers:{name:'GRASSRIVERS',base:['#7a6a4a','#6b5d40'],h:[4,7],win:'#2a2418',lit:'#ffe0b0'}

function districtAt(x,z){
  if(x>335)return 'keys';
  if(z>460&&x>-260&&x<260)return 'grassrivers';
  if(x>150)return 'beach';
  if(z<-160)return 'port';
  if(z>170)return 'cuba';
  if(Math.abs(x)<150&&Math.abs(z)<150)return 'downtown';
  return 'strip';
}
function addBuilding(x,z,w,d,h,dkey){
  const D=DISTRICTS[dkey];
  const base=D.base[(Math.random()*D.base.length)|0];
  const dayT=winTexture(base,D.win,Math.max(3,(h/4)|0),Math.max(3,(w/3.4)|0),D.win);
  const nightT=winTexture(base,D.win,Math.max(3,(h/4)|0),Math.max(3,(w/3.4)|0),D.lit);
  const m=new THREE.MeshStandardMaterial({map:dayT,roughness:.85});
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  b.position.set(x,h/2,z);b.castShadow=true;b.receiveShadow=true;
  b.userData={dayT,nightT,mat:m};
  scene.add(b);buildings.push(b);colliders.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2});
  return b;
}

}

const KEYS=[{x0:340,x1:470,z0:10,z1:150},{x0:495,x1:605,z0:20,z1:140},{x0:630,x1:745,z0:0,z1:160}];

function vigilUpdate(dt){
  if(!suspect)return;
  const v=suspect;
  if(v.hp<=0){v.hitT+=dt;if(v.hitT>6){scene.remove(v.g);suspect=null;}return;}
  const dx=v.pos.x-S.carPos.x,dz=v.pos.z-S.carPos.z,dd=Math.hypot(dx,dz);
  let tx,tz;
  if(dd<70){tx=v.pos.x+dx/dd*80;tz=v.pos.z+dz/dd*80;}
  else{tx=Math.round(v.pos.x/80)*80+(Math.random()<.02?(Math.random()<.5?80:-80):0);tz=Math.round(v.pos.z/80)*80;}
  if(v.pos.x>300)tx=280;if(v.pos.x<-380)tx=-360;if(v.pos.z>400)tz=380;if(v.pos.z<-400)tz=-380;
  const wantH=Math.atan2(-(tx-v.pos.x),-(tz-v.pos.z));
  let dh=wantH-v.h;while(dh>Math.PI)dh-=Math.PI*2;while(dh<-Math.PI)dh+=Math.PI*2;
  v.h+=Math.max(-2*dt,Math.min(2*dt,dh));
  v.speed=Math.min(36,v.speed+18*dt);
  const fx=-Math.sin(v.h),fz=-Math.cos(v.h);
  let nx=v.pos.x+fx*v.speed*dt,nz=v.pos.z+fz*v.speed*dt;
  if(surfaceAt(nx,nz)==='ocean'){nx=v.pos.x;nz=v.pos.z;v.speed*=.3;v.h+=1.2*dt;}
  const [cx,cz]=collide(nx,nz,1.5);
  if(Math.abs(cx-nx)>.001||Math.abs(cz-nz)>.001){v.speed*=.4;v.h+=(Math.random()<.5?1:-1)*.8;}
  v.pos.set(cx,0,cz);
  v.g.position.copy(v.pos);v.g.rotation.y=v.h;
  if(S.driving&&S.mode==='car'&&dd<4&&Math.abs(S.speed)>12&&v.hitT<=0){
    v.hp--;v.hitT=1.2;S.speed*=.5;playShot(.16,70);

  }
  if(v.hitT>0)v.hitT-=dt;
}

function musicTick(){
  if(!AC)return;
  if(station===0||!S.driving||!S.started)return;

    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}

    const nf=f=>{const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);return[o,g];};
    if(station===1){ // synthwave
      const bass=[55,55,65.4,55,49,49,55,61.7][st8];
      {const[o,g]=nf();o.type='square';o.frequency.value=bass;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+spb*.95);o.start(t);o.stop(t+spb);}
      const arp=[220,261.6,329.6,261.6,220,261.6,329.6,392][st8];
      {const[o,g]=nf();o.type='sawtooth';o.frequency.value=arp;g.gain.setValueAtTime(.028,t);g.gain.exponentialRampToValueAtTime(.001,t+spb*.9);o.start(t);o.stop(t+spb);}
      if(st8===0||st8===4){const[o,g]=nf();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.start(t);o.stop(t+.15);}
    }else if(station===2){ // latin house

      {const src=AC.createBufferSource();src.buffer=noiseBuf;const g=AC.createGain();const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=6000;
        src.connect(f);f.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(st8%2?.035:.015,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);src.start(t);src.stop(t+.06);}
      if(st8===2||st8===3||st8===6){const[o,g]=nf();o.type='triangle';o.frequency.value=[523,587,659][st8===2?0:st8===3?1:2];g.gain.setValueAtTime(.03,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.start(t);o.stop(t+.2);}
      if(st8===0){const[o,g]=nf();o.type='sawtooth';o.frequency.value=110;g.gain.setValueAtTime(.025,t);g.gain.exponentialRampToValueAtTime(.001,t+spb*3);o.start(t);o.stop(t+spb*4);}
    }else if(station===3){ // conspiracy talk: muffled voice + static
      {const src=AC.createBufferSource();src.buffer=noiseBuf;const g=AC.createGain();const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1200;f.Q.value=2;
        src.connect(f);f.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.012,t);g.gain.setValueAtTime(.012,t+spb*.9);src.start(t);src.stop(t+spb);}
      if(Math.random()<.6){const[o,g]=nf();o.type='square';const f0=140+Math.random()*160;
        o.frequency.setValueAtTime(f0,t);o.frequency.linearRampToValueAtTime(f0*(0.8+Math.random()*.5),t+spb*.8);

// ---------- world update: traffic, peds, police, wanted ----------
function updateWorld(dt){
  // traffic
  for(const v of S.noTraffic?[]:traffic){
    const fx=-Math.sin(v.h),fz=-Math.cos(v.h);
    // slow near player car
    const dp=Math.hypot(v.pos.x-S.carPos.x,v.pos.z-S.carPos.z);
    const sp=dp<10?0:v.speed;
    v.pos.x+=fx*sp*dt;v.pos.z+=fz*sp*dt;
    // wrap
    if(v.pos.x<-430)v.pos.x=310;if(v.pos.x>320)v.pos.x=-420;
    if(v.pos.z<-430)v.pos.z=420;if(v.pos.z>430)v.pos.z=-420;
    // random turn at intersections
    const rx=Math.round(v.pos.x/80)*80,rz=Math.round(v.pos.z/80)*80;
    if(Math.abs(v.pos.x-rx)<1.2&&Math.abs(v.pos.z-rz)<1.2&&Math.random()<.02){
      v.h+=Math.PI/2*(Math.random()<.5?1:-1);
    }
    v.g.position.copy(v.pos);v.g.rotation.y=v.h;
    // player car collision
    if(S.driving&&dp<3.4){
      const impact=Math.abs(S.speed);
      const push=Math.atan2(v.pos.x-S.carPos.x,v.pos.z-S.carPos.z);
      v.pos.x+=Math.sin(push)*impact*dt*2;v.pos.z+=Math.cos(push)*impact*dt*2;
      S.speed*=.55;
      if(impact>10)addWanted(1);
    }
  }
  // peds
  for(const p of peds){
    if(p.down>0){p.down-=dt;if(p.down<=0){pedTarget(p);p.pos.set(p.tx,0,p.tz);p.g.rotation.x=0;p.g.visible=false;p.wt=14;}continue;}
    if(p.wt>0){p.wt-=dt;if(p.wt<=0)p.g.visible=true;continue;}
    const dx=p.tx-p.pos.x,dz=p.tz-p.pos.z,dd=Math.hypot(dx,dz);
    if(dd<3){pedTarget(p);continue;}
    // flee from fast player car
    const dp=Math.hypot(p.pos.x-S.carPos.x,p.pos.z-S.carPos.z);
    let vx=dx/dd*3.2,vz=dz/dd*3.2;
    if(dp<14&&Math.abs(S.speed)>8){vx=(p.pos.x-S.carPos.x)/dp*8;vz=(p.pos.z-S.carPos.z)/dp*8;}
    p.pos.x+=vx*dt;p.pos.z+=vz*dt;
    p.g.position.copy(p.pos);p.g.rotation.y=Math.atan2(vx,vz);
    p.ll.rotation.x=Math.sin(performance.now()*.014)*.6;p.lr.rotation.x=-p.ll.rotation.x;
    // run over
    if(S.driving&&dp<2&&Math.abs(S.speed)>5){
      p.down=22;p.g.rotation.x=Math.PI/2;p.g.position.y=.3;addWanted(1);
    }
  }
  // wanted decay (ditch-the-car rule)
  if(W.stars>0&&W.bustedT<=0){
    if(!(W.known&&S.driving)){
      W.decay+=dt;
      if(W.decay>8){W.stars--;W.decay=0;if(W.stars===0)W.known=false;}
    }
  }
  // police presence
  const want=Math.min(4,W.stars+1);
  if(W.stars>0){while(cops.length<want)spawnCop();}
  // police pursuit
  let nearest=1e9;
  for(const v of cops){
    const px=S.driving?S.carPos.x:player.position.x,pz=S.driving?S.carPos.z:player.position.z;
    const ddp=Math.hypot(px-v.pos.x,pz-v.pos.z);nearest=Math.min(nearest,ddp);
    let tx=px,tz=pz;
    if(S.driving&&S.mode!=='car'&&surfaceAt(px,pz)==='ocean'){tx=300;tz=Math.max(-400,Math.min(400,pz));}
    else if(px>320&&ddp>20){
      if(v.pos.x<300){tx=320;tz=80;}
      else if(Math.abs(v.pos.z-80)>=9){tx=v.pos.x;tz=80;}
      else{tx=px;tz=80;}
    }
    if(ddp>36&&tx===px&&tz===pz){
      const onH=Math.abs(v.pos.z-Math.round(v.pos.z/80)*80)<9;
      const onV=Math.abs(v.pos.x-Math.round(v.pos.x/80)*80)<9;
      if(onH&&Math.abs(v.pos.x-px)>=9){tx=Math.round(px/80)*80;tz=Math.round(v.pos.z/80)*80;}
      else if(onV&&Math.abs(v.pos.z-pz)>=9){tx=Math.round(v.pos.x/80)*80;tz=Math.round(pz/80)*80;}
      else if(!onH&&!onV){
        const nxl=Math.round(v.pos.x/80)*80,nzl=Math.round(v.pos.z/80)*80;
        if(Math.abs(v.pos.x-nxl)<Math.abs(v.pos.z-nzl)){tx=nxl;tz=v.pos.z;}else{tx=v.pos.x;tz=nzl;}
      }
    }
    const dx=tx-v.pos.x,dz=tz-v.pos.z,dd=Math.hypot(dx,dz);
    const wantH=Math.atan2(-dx,-dz);
    let dh=wantH-v.h;while(dh>Math.PI)dh-=Math.PI*2;while(dh<-Math.PI)dh+=Math.PI*2;
    v.h+=Math.max(-2.2*dt,Math.min(2.2*dt,dh));
    const maxSp=44;
    if(v.rev>0){v.rev-=dt;v.speed=Math.max(-10,v.speed-30*dt);}
    else v.speed=Math.min(maxSp,v.speed+26*dt);
    if(ddp<14&&v.rev<=0)v.speed=Math.min(v.speed,Math.max(1.2,ddp*.9));
    const fx=-Math.sin(v.h),fz=-Math.cos(v.h);
    let nx=v.pos.x+fx*v.speed*dt,nz=v.pos.z+fz*v.speed*dt;
    if(surfaceAt(nx,nz)==='ocean'){nx=v.pos.x;nz=v.pos.z;v.speed*=.3;if(v.rev<=0){v.rev=.7;v.h+=(Math.random()<.5?1:-1)*.9;}}
    const [cx,cz]=collide(nx,nz,1.5);
    if(Math.abs(cx-nx)>.001||Math.abs(cz-nz)>.001){v.speed*=.3;v.stuck+=dt;if(v.stuck>0.6){v.rev=.8;v.stuck=0;v.h+=(Math.random()<.5?1:-1)*.9;}}
    else v.stuck=0;
    v.pos.set(cx,0,cz);
    v.g.position.copy(v.pos);v.g.rotation.y=v.h;
    // ram the player
    if(S.driving&&ddp<3.6){S.speed*=(1-2*dt);}
    // light bar flash
    const ph=Math.floor(performance.now()*.008)%2;
    if(v.barR){v.barR.material.color.setHex(ph?0xff2020:0x400808);v.barB.material.color.setHex(ph?0x202860:0x4060ff);}
  }
  // busted check
  if(W.stars>0&&W.bustedT<=0){
    const pinned=cops.some(v=>Math.hypot(v.pos.x-(S.driving?S.carPos.x:player.position.x),v.pos.z-(S.driving?S.carPos.z:player.position.z))<(S.driving?6:3.6));
    if(pinned&&(!S.driving||Math.abs(S.speed)<3)){W.pinT=(W.pinT||0)+dt;if(W.pinT>1.4){W.bustedT=2.6;bustedEl.style.display='flex';}}
    else W.pinT=0;
  }
  if(W.bustedT>0){
    W.bustedT-=dt;
    if(W.bustedT<=0){
      bustedEl.style.display='none';
      W.stars=0;W.known=false;W.decay=0;W.pinT=0;
      for(const v of cops){scene.remove(v.g);}cops.length=0;clearHunters();
      S.driving=false;player.visible=true;
      player.position.set(240,0,100);S.footHeading=0;
    }
  }
  // police helicopter (4+ stars)
  if(W.stars>=4&&!heli.active){heli.active=true;heli.g.visible=true;heli.pos.set(S.carPos.x+120,60,S.carPos.z+120);}
  if(heli.active){
    const px=S.driving?S.carPos.x:player.position.x,pz=S.driving?S.carPos.z:player.position.z;
    if(W.stars<4){
      heli.pos.x+=40*dt;heli.pos.z+=40*dt;heli.pos.y+=10*dt;
      heli.spot.intensity=Math.max(0,heli.spot.intensity-600*dt);heli.cone.material.opacity=Math.max(0,heli.cone.material.opacity-.3*dt);
      if(heli.pos.y>95){heli.active=false;heli.g.visible=false;}
    }else{
      const tx=px+Math.sin(performance.now()*.0004)*24,tz=pz+Math.cos(performance.now()*.0004)*24;
      heli.pos.x+=(tx-heli.pos.x)*Math.min(1,dt*1.1);
      heli.pos.z+=(tz-heli.pos.z)*Math.min(1,dt*1.1);
      heli.pos.y+=(42-heli.pos.y)*Math.min(1,dt*1.4);
      heli.g.rotation.y=Math.atan2(-(tx-heli.pos.x),-(tz-heli.pos.z));
      heli.g.rotation.z=Math.sin(performance.now()*.001)*.05;
      heli.spot.target.position.set(px-heli.pos.x,-44,pz-heli.pos.z);
      const night=S.t<.27||S.t>.77;
      heli.spot.intensity=night?420:60;

    }

// ---------- collision ----------
function collide(px,pz,r){
  for(const c of colliders){
    if(px+r<c.x0||px-r>c.x1||pz+r<c.z0||pz-r>c.z1)continue;
    const dxl=px+r-c.x0,dxr=c.x1-(px-r),dzl=pz+r-c.z0,dzr=c.z1-(pz-r);
    const m=Math.min(dxl,dxr,dzl,dzr);
    if(m===dxl)px=c.x0-r;else if(m===dxr)px=c.x1+r;else if(m===dzl)pz=c.z0-r;else pz=c.z1+r;
  }
  px=Math.max(-460,Math.min(790,px));pz=Math.max(-460,Math.min(820,pz));
  return[px,pz];
}

// ---------- day/night ----------
function applyTime(){
  const hours=S.t*24;
  const day=Math.max(0,Math.sin(Math.PI*(hours-6)/12));
  const dusk=Math.max(0,1-Math.abs(hours-18)/1.6)+Math.max(0,1-Math.abs(hours-6)/1.6);
  const night=1-Math.min(1,day*3+.15);
  const az=Math.PI*(hours-6)/12;
  sun.position.set(Math.cos(az)*300,Math.max(20,Math.sin(az)*300),80);
  sun.intensity=day*2.4+night*.12;
  sun.color.setHSL(night>.6?.62:.08,night>.6?.4:.75,.6+day*.4);
  hemi.intensity=.3+day*.5;
  const skyDay=new THREE.Color(0x9fd4f0),skyDusk=new THREE.Color(0xff7a4c),skyNight=new THREE.Color(0x0a0620);
  const sk=skyNight.clone().lerp(skyDay,day);sk.lerp(skyDusk,Math.min(1,dusk)*.55*(1-night*.5));
  scene.background=sk;scene.fog.color=sk.clone().lerp(new THREE.Color(0xffffff),day*.15);
  scene.fog.near=140+day*120;scene.fog.far=800+day*600;
  for(const b of buildings){b.userData.mat.map=night>.5?b.userData.nightT:b.userData.dayT;b.userData.mat.emissive=new THREE.Color(0xffffff);b.userData.mat.emissiveMap=night>.5?b.userData.nightT:null;b.userData.mat.emissiveIntensity=night*.9;b.userData.mat.needsUpdate=true;}
  headL.intensity=headR.intensity=night*180;
  tailL.material.color.setHex(night>.5?0xff2222:0x550000);tailR.material.color.setHex(night>.5?0xff2222:0x550000);
  ocean.material.color.setHex(night>.5?0x06283a:0x0e6f8f);

}

    const dx=px-g.pos.x,dz=pz-g.pos.z,dd=Math.hypot(dx,dz);

    g.h+=Math.max(-2.4*dt,Math.min(2.4*dt,dh));

let tracer=null,tracerT=0,muzzle=null,shotCd=0,lastShotStar=0;
function shootNow(){
  if(S.driving||shotCd>0||!S.started)return;
  shotCd=.28;
  const dir=new THREE.Vector3();camera.getWorldDirection(dir);
  const org=player.position.clone();org.y=1.5;
  let best=null,bestD=60;
  for(const p of peds){if(p.down>0||p.wt>0)continue;
    const to=p.pos.clone().sub(org);to.y=1.2-org.y;const d=to.length();if(d>bestD)continue;
    to.normalize();if(to.dot(dir)>.985){best={type:'ped',p,d};bestD=d;}}
  for(const v of cops){
    const to=v.pos.clone().sub(org);to.y=1-org.y;const d=to.length();if(d>bestD)continue;
    to.normalize();if(to.dot(dir)>.99){best={type:'cop',v,d};bestD=d;}}
  for(const g of goons){
    const to=g.pos.clone().sub(org);to.y=1.2-org.y;const d=to.length();if(d>bestD)continue;
    to.normalize();if(to.dot(dir)>.985){best={type:'goon',g,d};bestD=d;}}
  const end=org.clone().add(dir.clone().multiplyScalar(best?bestD:40));
  if(tracer)scene.remove(tracer);
  const g=new THREE.BufferGeometry().setFromPoints([org,end]);
  tracer=new THREE.Line(g,new THREE.LineBasicMaterial({color:0xfff2a0}));scene.add(tracer);tracerT=.08;
  if(!muzzle){muzzle=new THREE.PointLight(0xffe9a0,0,12);scene.add(muzzle);}
  muzzle.position.copy(org);muzzle.intensity=30;
  if(AC){const o=AC.createOscillator(),gn=AC.createGain();o.type='square';o.frequency.value=140;gn.gain.setValueAtTime(.2,AC.currentTime);gn.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.12);o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+.13);}
  if(best&&best.type==='ped'){best.p.down=22;best.p.g.rotation.x=Math.PI/2;best.p.g.position.y=.3;addWanted(1);}
  if(best&&best.type==='cop'){
    scene.remove(best.v.g);cops.splice(cops.indexOf(best.v),1);addWanted(1);
  }
  if(best&&best.type==='goon'){
    const g=best.g;goons.splice(goons.indexOf(g),1);
    g.g.rotation.x=Math.PI/2;g.g.position.y=.3;corpses.push({g:g.g,t:6});
  }
  if(!best&&performance.now()-lastShotStar>10000){
    for(const p of peds){if(p.down<=0&&p.pos.distanceTo(player.position)<40){addWanted(1);lastShotStar=performance.now();break;}}
  }
}

function simStep(dt){
  if(S.gal)return;
  S.anim=(S.anim||0)+dt;if(luckyArm)luckyArm.rotation.z=-(.55+Math.sin(S.anim*2.4)*.45);
  updateWorld(dt);
  huntersUpdate(dt);
  goonsUpdate(dt);
  taxiUpdate(dt);
  vigilUpdate(dt);
  for(const pk of packages){
    if(pk.got)continue;
    pk.m.rotation.y+=dt*1.4;pk.m.position.y=.6+Math.sin(performance.now()*.003+pk.x)*.15;
    const px2=S.driving?S.carPos.x:player.position.x,pz2=S.driving?S.carPos.z:player.position.z;
    if(Math.hypot(px2-pk.x,pz2-pk.z)<2.6&&(!S.driving||Math.abs(S.speed)<18)){
      pk.got=true;scene.remove(pk.m);
      M.cash+=100;cashEl.textContent='$'+M.cash;
      const left=packages.filter(q=>!q.got).length;
      if(left>0)showBanner('HIDDEN PACKAGE '+(10-left)+'/10 - $100',2);
      else{M.cash+=5000;cashEl.textContent='$'+M.cash;showBanner('ALL 10 PACKAGES - $5000 BONUS',3);}
    }
  }
  if(S.regenT>0)S.regenT-=dt;
  else if(S.hp>0&&S.hp<100)S.hp=Math.min(100,S.hp+8*dt);
  if(S.wastedT>0){
    S.wastedT-=dt;
    if(S.wastedT<=0){
      wastedEl.style.display='none';S.hp=100;
      if(S.driving){S.driving=false;player.visible=true;}
      player.position.set(240,0,100);S.footHeading=0;S.speed=0;W.stars=0;W.known=false;
      M.cash=Math.max(0,Math.round(M.cash*.9));cashEl.textContent='$'+M.cash;
    }
    return;
  }
  if(S.switchT>0){
    S.switchT-=dt;
    if(!S.swapped&&S.switchT<=.45){S.swapped=true;applySwitch();}
    if(S.switchT<=0)S.switchT=0;
    return;
  }
  if(S.driving||S.autoDrive){
    const up=keys.ArrowUp||keys.KeyW||S.autoDrive, dn=keys.ArrowDown||keys.KeyS;
    const lf=keys.ArrowLeft||keys.KeyA, rt=keys.ArrowRight||keys.KeyD;
    const hb=keys.Space;
    const VP={car:{max:42,acc:22,turn:1.5,drag:.35},boat:{max:30,acc:11,turn:.85,drag:.12},airboat:{max:34,acc:16,turn:1.2,drag:.2}}[S.mode];
    const maxS=(S.mode==='car'&&S.spikeT>0)?15:VP.max,acc=VP.acc;
    if(S.spikeT>0)S.spikeT-=dt;
    const grip=1-S.wet*.5;
    if(up)S.speed=Math.min(maxS,S.speed+acc*(1-S.wet*.35)*dt);
    else if(dn)S.speed=Math.max(-12,S.speed-acc*.8*grip*dt);
    else S.speed*=(1-VP.drag*(1-S.wet*.55)*dt);
    if(hb)S.speed*=(1-1.6*grip*dt);
    const steer=(lf?-1:0)+(rt?1:0);
    S.heading+=steer*dt*(hb?2.6:VP.turn)*(1+S.wet*.25)*Math.min(1,Math.abs(S.speed)/12)*Math.sign(S.speed||1);
    const fx=-Math.sin(S.heading),fz=-Math.cos(S.heading);
    let nx=S.carPos.x+fx*S.speed*dt;
    let nz=S.carPos.z+fz*S.speed*dt;
    const surf=surfaceAt(nx,nz);
    if((S.mode==='car'&&surf==='ocean')||(S.mode==='boat'&&surf!=='ocean'&&surf!=='swamp')){nx=S.carPos.x;nz=S.carPos.z;S.speed*=.4;}
    if(S.mode==='car'&&surf==='swamp')S.speed=Math.max(-8,Math.min(8,S.speed));
    const [cx,cz]=collide(nx,nz,1.6);
    if(Math.abs(cx-nx)>.001||Math.abs(cz-nz)>.001)S.speed*=.4;
    S.carPos.set(cx,0,cz);
    const vm=vehMesh[S.mode];
    vm.position.copy(S.carPos);vm.rotation.y=S.heading;vm.rotation.z=0;
    if(S.mode!=='car'){vm.position.y=.12+Math.sin(performance.now()*.0025)*.09;vm.rotation.z=Math.sin(performance.now()*.0021)*.03;}
    if(S.mode==='car')wheels.forEach(w=>w.rotation.x+=S.speed*dt/.42);
    if(S.mode==='airboat')fanBlade.rotation.z+=S.speed*dt*2;
    if(S.mode!=='car'&&Math.abs(S.speed)>8){
      wakeAcc+=dt;
      if(wakeAcc>.08){wakeAcc=0;const w=wakePool[wakeI++%48];
        w.m.position.set(S.carPos.x+Math.sin(S.heading)*3,.06,S.carPos.z+Math.cos(S.heading)*3);
        w.m.rotation.z=-S.heading;w.m.visible=true;w.life=1.2;}
    }
    document.getElementById('speed').textContent=Math.abs(Math.round(S.speed*2.24));
    document.getElementById('mode').textContent=CHARS[S.cur].name+' - '+(S.mode==='car'?'WHEELS':S.mode==='boat'?'BOAT':'AIRBOAT');
    if(engOsc){engOsc.frequency.value=55+Math.abs(S.speed)*6;engGain.gain.value=S.started?.06+Math.abs(S.speed)/maxS*.09:0;}
  }else{
    const sp=(keys.ShiftLeft||keys.ShiftRight)?10:4.5;
    let mx=0,mz=0;
    if(keys.KeyW||keys.ArrowUp)mz-=1;if(keys.KeyS||keys.ArrowDown)mz+=1;
    if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;
    if(mx||mz){
      S.footHeading=Math.atan2(mx,mz);
      const camF=new THREE.Vector3();camera.getWorldDirection(camF);
      const ang=Math.atan2(camF.x,camF.z);
      const wx=Math.sin(ang+Math.atan2(mx,mz))*sp*dt,wz=Math.cos(ang+Math.atan2(mx,mz))*sp*dt;
      let fnx=player.position.x+wx,fnz=player.position.z+wz;
      if(surfaceAt(fnx,fnz)==='ocean'){fnx=player.position.x;fnz=player.position.z;}
      else if(surfaceAt(fnx,fnz)==='swamp'){fnx=player.position.x+wx*.5;fnz=player.position.z+wz*.5;}
      const [cx,cz]=collide(fnx,fnz,.5);
      player.position.set(cx,0,cz);player.rotation.y=ang+Math.atan2(mx,mz);
      legL.rotation.x=Math.sin(performance.now()*.012)*.7;legR.rotation.x=-legL.rotation.x;
    }
    document.getElementById('speed').textContent=0;
    document.getElementById('mode').textContent=CHARS[S.cur].name+' - ON FOOT';
    if(engGain)engGain.gain.value=0;
  }
}

  else if(spot==='map'){S.carPos.set(160,0,100);S.heading=-.8;S.t=.62;W.stars=2;if(P.has('st'))station=parseInt(P.get('st'))||0;}
  else if(spot==='block'){S.carPos.set(240,0,200);S.heading=0;S.t=.62;W.stars=4;W.known=false;}
  vehMesh[S.mode].position.copy(S.carPos);vehMesh[S.mode].rotation.y=S.heading;
  S.autoDrive=P.has('drive');S.noTraffic=P.has('notraffic');
  const ffN=parseInt(P.get('ff')||'0');
  for(let i=0;i<ffN;i++){simStep(1/30);missionUpdate(1/30);}
  snapCam();
  if(P.has('gal')){S.gal=true;galEl.style.display='flex';gi=parseInt(P.get('gal'))||0;gShow();}
  if(!shotT)window.__shotReady=true;
}
tick();
</script>
